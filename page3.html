                        ${JOB_DATA.kpis.map((kpi, idx) => `
                            <div class="border border-slate-100 rounded-2xl overflow-hidden bg-white shadow-md">
                                <button onclick="toggleAccordion('kpi-${idx}', this)" class="w-full flex justify-between items-center p-4 focus:outline-none hover:bg-slate-50/50 transition-all">
                                    <div class="flex items-center">
                                        <span class="text-2xl mr-3">${kpi.icon}</span>
                                        <div class="text-left">
                                            <div class="font-extrabold text-slate-700 text-sm tracking-tight">${kpi.title}</div>
                                            <div class="text-emerald-600 font-black text-xs mt-0.5">${kpi.reward}</div>
                                        </div>
                                    </div>
                                    <i class="fa-solid fa-chevron-down text-slate-300 transition-transform duration-300"></i>
                                </button>
                                <div id="kpi-${idx}" class="accordion-content bg-slate-50/50 border-t border-slate-100">
                                    <div class="p-4 text-sm text-slate-600 space-y-2">
                                        ${kpi.positives.map(p => `
                                            <div class="flex items-start">
                                                <i class="fa-solid fa-check text-emerald-500 mr-2 mt-1 shrink-0 text-xs"></i>
                                                <span class="leading-relaxed">${p}</span>
                                            </div>
                                        `).join('')}
                                        ${kpi.negatives.length > 0 ? `
                                            <div class="text-[10px] font-black text-rose-500 uppercase mt-3 mb-1.5 tracking-wider">Các lỗi vi phạm:</div>
                                            ${kpi.negatives.map(n => `
                                                <div class="flex items-start text-xs text-rose-600 mb-1">
                                                    <i class="fa-solid fa-xmark mr-2 mt-1 shrink-0 text-xs"></i>
                                                    <span class="leading-relaxed">${n}</span>
                                                </div>
                                            `).join('')}
                                        ` : ''}
                                        ${kpi.alert ? `
                                            <div class="bg-rose-50 text-rose-700 p-3 rounded-xl text-[10px] mt-3 border border-rose-100 font-medium leading-relaxed">
                                                ${kpi.alert}
                                            </div>
                                        ` : ''}
                                    </div>
                                </div>
                            </div>
                        `).join('')}
                    </div>

                    <!-- THANG ĐIỂM TRỪ TRỰC QUAN -->
                    <div class="bg-white rounded-[2rem] border border-slate-100 shadow-xl overflow-hidden p-6 mt-4">
                        <h4 class="font-black text-slate-800 text-lg mb-1 tracking-tight">Thang Điểm Trừ (Áp dụng ĐỘC LẬP)</h4>
                        <p class="text-xs text-slate-400 font-medium mb-3">Lỗi của mục nào tính riêng mục đó, không cộng dồn chung.</p>
                        <p class="text-[11px] text-blue-600 italic mb-4 leading-relaxed font-semibold bg-blue-50/50 p-3 rounded-xl border border-blue-100/50">
                            Ví dụ: Vi phạm 4 lỗi Kỷ luật (nhận 70% của 300k), 2 lỗi Vận hành (nhận 90% của 500k).
                        </p>
                        <div class="border border-slate-100 rounded-2xl overflow-hidden">
                            <table class="w-full text-center text-sm">
                                <thead class="bg-slate-50"><tr class="text-slate-500 font-bold border-b border-slate-100"><th class="py-3 border-r border-slate-100 uppercase text-[9px] tracking-wider">Số lỗi</th><th class="uppercase text-[9px] tracking-wider">Mức nhận</th></tr></thead>
                                <tbody>
                                    ${JOB_DATA.kpiScale.map(scale => `
                                        <tr class="border-b border-slate-50 last:border-0">
                                            <td class="py-3 font-semibold text-slate-600 border-r border-slate-100">${scale.error}</td>
                                            <td class="py-3 font-black ${scale.color}">${scale.percent}</td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </section>

                <!-- VI. Nguyên tắc ghi nhận lỗi -->
                <section class="bg-white rounded-3xl p-5 border border-slate-100 shadow-lg">
                    <h3 class="font-black text-slate-800 mb-4 flex items-center uppercase text-xs tracking-wider"><i class="fa-solid fa-scale-balanced text-rose-500 mr-2.5 text-base"></i> VI. Nguyên tắc ghi nhận lỗi</h3>
                    <div class="space-y-3">
                        ${JOB_DATA.rules.map(rule => `
                            <div class="flex items-start text-sm text-slate-600 leading-relaxed">
                                <i class="fa-solid fa-circle text-[5px] text-slate-300 mt-2 mr-3 shrink-0"></i>
                                <p>${rule}</p>
                            </div>
                        `).join('')}
                    </div>
                </section>

                <!-- VII. Chính sách thâm niên -->
                <section class="bg-white rounded-3xl p-5 border border-slate-100 shadow-lg border-l-4 border-l-emerald-500">
                    <h3 class="font-black text-slate-800 mb-3 flex items-center uppercase text-xs tracking-wider"><i class="fa-solid fa-award text-emerald-500 mr-2.5 text-base"></i> VII. Chính sách thâm niên</h3>
                    <div class="flex items-center space-x-3 mb-4">
                        <div class="text-emerald-600 font-black text-lg">${JOB_DATA.seniority.reward}</div>
                        <div class="text-[10px] bg-emerald-100 text-emerald-700 px-2.5 py-1 rounded-full font-bold uppercase tracking-wider">${JOB_DATA.seniority.max}</div>
                    </div>
                    <div class="space-y-2.5">
                        ${JOB_DATA.seniority.conditions.map(cond => `
                            <div class="flex items-start text-sm text-slate-600 leading-relaxed">
                                <i class="fa-solid fa-check-circle text-emerald-500 mt-1 mr-3 shrink-0 text-xs"></i>
                                <p>${cond}</p>
                            </div>
                        `).join('')}
                    </div>
                </section>

                <!-- AI SAKE Assistant -->
                <section class="bg-indigo-650 rounded-[2rem] p-6 text-white shadow-2xl relative overflow-hidden bg-indigo-600">
                    <div class="absolute -right-6 -bottom-6 opacity-20 text-7xl"><i class="fa-solid fa-robot"></i></div>
                    <div class="relative z-10">
                        <h3 class="font-black mb-1 flex items-center uppercase text-sm tracking-wider">Trợ Lý AI Sake <span class="ml-2 text-xs animate-sparkle">✨</span></h3>
                        <p class="text-[10px] text-indigo-100 mb-5 font-bold tracking-widest uppercase">Hỗ trợ riêng cho Runner</p>
                        <div class="space-y-4">
                            <div>
                                <label class="block text-[10px] font-extrabold uppercase text-indigo-200 tracking-wider mb-1">Chủ đề hỗ trợ</label>
                                <select id="ai-task" class="w-full text-xs font-bold bg-white/10 border border-white/15 text-white rounded-xl p-3.5 outline-none focus:bg-white focus:text-indigo-900 transition-all shadow-inner">
                                    <option value="policy" class="text-indigo-900 font-bold">📖 Hỏi về Nội quy & Lương</option>
                                    <option value="upsell" class="text-indigo-900 font-bold">🍻 Cách mời khách uống thêm bia</option>
                                    <option value="complaint" class="text-indigo-900 font-bold">🎭 Xử lý phàn nàn của khách</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-[10px] font-extrabold uppercase text-indigo-200 tracking-wider mb-1">Nhập câu hỏi hoặc tình huống</label>
                                <textarea id="ai-input" rows="2" class="w-full text-xs bg-white/10 border border-white/15 text-white rounded-xl p-3.5 outline-none placeholder-indigo-200 focus:bg-white focus:text-indigo-900 transition-all shadow-inner leading-relaxed" placeholder="Ví dụ: Em đi trễ 5 lần thì lương tính ntn?"></textarea>
                            </div>
                            <button onclick="askLocalAI()" class="w-full bg-white text-indigo-600 font-black py-4 rounded-2xl shadow-xl flex justify-center items-center transition-all active:scale-95 text-xs uppercase tracking-wider">
                                <span id="ai-btn-text">Gửi Câu Hỏi</span>
                                <span id="ai-loading" class="loader hidden ml-2 !border-t-indigo-600 !border-indigo-100"></span>
                            </button>
                            <div id="ai-response-box" class="hidden mt-4 bg-white/10 rounded-2xl p-4 border border-white/10 backdrop-blur-sm shadow-inner overflow-y-auto max-h-60">
                                <p class="text-[9px] font-black uppercase mb-1.5 flex items-center tracking-wider text-indigo-200"><i class="fa-solid fa-comment-dots mr-1.5 text-xs"></i> Trợ lý Sake trả lời:</p>
                                <div id="ai-result-text" class="text-[11px] leading-relaxed italic text-white font-medium"></div>
                            </div>
                        </div>
                    </div>
                </section>

                <footer class="pt-8 pb-4 text-center text-[10px] text-slate-400 font-extrabold uppercase tracking-widest opacity-60">
                    <p>Phê duyệt bởi Ban Quản lý Cây Sake</p>
                </footer>
            </main>
        `;
        root.innerHTML = htmlContent;
    }

    function toggleAccordion(id, btn) {
        const content = document.getElementById(id);
        const icon = btn.querySelector('.fa-chevron-down');
        content.classList.toggle('active');
        icon.classList.toggle('rotate-180');
    }

    function askLocalAI() {
        const inputField = document.getElementById('ai-input');
        const btnText = document.getElementById('ai-btn-text');
        const loading = document.getElementById('ai-loading');
        const responseBox = document.getElementById('ai-response-box');
        const responseText = document.getElementById('ai-result-text');

        const query = inputField.value.trim().toLowerCase();
        if (!query) return;

        btnText.textContent = "Đang tra cứu...";
        loading.classList.remove('hidden');
        responseBox.classList.add('hidden');

        setTimeout(() => {
            let foundAnswer = "";
            const LOCAL_AI_DATA = [
                {
                    keywords: ["trễ", "muộn", "về sớm", "giờ"],
                    answer: "Theo nội quy, đi trễ hoặc về sớm quá 15 phút tính là 1 lỗi Kỷ luật. Nếu em trễ 5 lần trong tháng, em sẽ nhận <b>70% KPI Kỷ luật</b> (mất 90.000đ từ khoản 300k). Hãy cố gắng đi làm đúng giờ nhé!"
                },
                {
                    keywords: ["nghỉ", "phép", "đột xuất"],
                    answer: "Nếu em nghỉ quá 02 ngày/tháng (dù có phép) hoặc vi phạm quy định báo nghỉ, em sẽ bị <b>Trừ 100% KPI Chuyên cần</b> (300.000đ). Nếu nghỉ không phép sẽ bị kỷ luật nặng hơn."
                },
                {
                    keywords: ["bia nóng", "bia lạnh", "tủ bia", "bia"],
                    answer: "Nguyên tắc cốt lõi là: <b>Luôn ưu tiên bán bia lạnh trước</b>. Em chỉ được xuất bia nóng khi bia lạnh cùng loại đã hết và phải báo cáo Giám sát. Xuất sai sẽ bị tính lỗi vận hành nghiêm trọng."
                },
                {
                    keywords: ["nước chấm", "pha", "hụt", "20%"],
                    answer: "Nước chấm phải luôn sẵn sàng trước giờ cao điểm và duy trì mức tồn trên 20%. Nếu để hụt nước chấm khi khách đông hoặc pha sai công thức, em sẽ bị trừ điểm vào KPI Nước chấm & Peak Hour (500.000đ)."
                },
                {
                    keywords: ["lương", "tổng", "thu nhập", "bao nhiêu"],
                    answer: "Tổng thu nhập tối đa hiện tại của em sau khi được điều chỉnh tăng là <b>6.500.000đ</b>. Trong đó: Lương cơ bản mới là 4.900.000đ và tổng KPI tối đa 1.600.000đ. Ngoài ra em còn nhận tiền Tip từ bộ phận Phục vụ."
                },
                {
                    keywords: ["kpi", "tính sao", "thang điểm"],
                    answer: "Mỗi hạng mục KPI tính lỗi riêng biệt: 0-1 lỗi (100%), 2-3 lỗi (90%), 4-5 lỗi (70%), 6-7 lỗi (50%), 8-9 lỗi (30%), >=10 lỗi (0%). Lỗi mục nào trừ tiền mục đó, không cộng dồn lỗi chung."
                },
                {
                    keywords: ["mời bia", "upsell", "bán thêm"],
                    answer: "Khi mang món nướng hoặc hải sản ra, em có thể mời khéo: 'Dạ món này dùng kèm với bia lạnh đang rất hợp, em lấy cho bàn mình thêm mấy lon bia lạnh nhé ạ?'"
                },
                {
                    keywords: ["xin lỗi", "phàn nàn", "bia không lạnh"],
                    answer: "Nếu khách than bia không lạnh, em hãy xin lỗi chân thành: 'Dạ em rất xin lỗi vì bia chưa đạt độ lạnh như ý khách, anh/chị đợi em 1 phút em đổi ngay những lon lạnh nhất từ kho lạnh ra cho mình ạ!'"
                },
                {
                    keywords: ["thâm niên", "tăng lương"],
                    answer: "Em sẽ được tăng lương cơ bản thêm <b>+200.000đ/lần</b> khi làm đủ 12 tháng liên tục hoặc đạt 100% KPI trong 6 tháng liên tục kèm đánh giá tốt từ Quản lý. Tối đa tăng được 5 lần nhé!"
                }
            ];
            
            for (const item of LOCAL_AI_DATA) {
                if (item.keywords.some(k => query.includes(k))) {
                    foundAnswer = item.answer;
                    break;
                }
            }

            if (!foundAnswer) {
                foundAnswer = "Trợ lý chưa tìm thấy chi tiết cho câu hỏi này. Em vui lòng kiểm tra lại ở các mục <b>I</b> hoặc <b>V</b> phía trên, hoặc hỏi trực tiếp <b>Giám sát ca</b> để được hỗ trợ nhé!";
            }

            responseText.innerHTML = foundAnswer;
            responseBox.classList.remove('hidden');
            btnText.textContent = "Gửi Câu Hỏi";
            loading.classList.add('hidden');
        }, 600);
    }

    window.onload = renderApp;
</script>
</body>
</html>
