</head>
<body class="text-slate-800 selection:bg-orange-200">

    <!-- Container gốc để Javascript tự động "vẽ" ứng dụng vào đây -->

                    </div>
                </div>

                <!-- IV. Lương & KPI -->
                <div>
                    <h3 class="font-bold text-lg mb-1 flex items-center text-slate-800"><div class="w-8 h-8 rounded-full bg-orange-50 text-orange-500 flex items-center justify-center mr-3"><i class="fa-solid fa-bullseye"></i></div> IV. Bảng Tiêu Chí KPI</h3>
                    <p class="text-xs text-slate-500 mb-4 italic pl-11">Bấm vào từng mục để xem chi tiết.</p>

                    <div class="space-y-3 mb-8 accordion-group">
                        ${JOB_DATA.kpis.map(kpi => `
                            <div class="border border-slate-100 rounded-2xl overflow-hidden bg-white shadow-sm transition-all duration-200 hover:shadow-md">
                                <button class="accordion-btn w-full flex justify-between items-center p-4 focus:outline-none hover:bg-slate-50/50 transition-colors">
                                    <div class="flex items-center">
                                        <div class="w-10 h-10 rounded-full bg-slate-50 flex items-center justify-center text-lg mr-3 shadow-inner">${kpi.icon}</div>
                                        <div class="text-left">
                                            <div class="font-bold text-slate-700 text-sm">${kpi.title}</div>
                                            <div class="text-emerald-500 font-bold text-xs mt-0.5">${kpi.reward}</div>
                                        </div>
                                    </div>
                                    <div class="w-6 h-6 rounded-full bg-slate-50 flex items-center justify-center"><i class="fa-solid fa-chevron-down text-slate-400 text-xs transition-transform duration-300"></i></div>
                                </button>
                                <div class="accordion-content bg-slate-50/50 border-t border-slate-50">
                                    <div class="p-4 text-sm text-slate-600 space-y-2.5">
                                        ${kpi.positives.map(p => `<p class="flex items-start"><i class="fa-solid fa-circle-check text-emerald-400 mt-1 mr-2 text-xs"></i> <span>${p}</span></p>`).join('')}
                                        ${kpi.negatives.length > 0 ? `<div class="mt-4"><p class="font-bold mb-2 text-rose-500 text-[10px] uppercase tracking-wider">Các lỗi vi phạm (Tiêu cực):</p><ul class="space-y-1.5 text-xs bg-white p-3 rounded-xl border border-slate-100">${kpi.negatives.map(n => `<li class="flex items-start"><i class="fa-solid fa-xmark text-rose-400 mt-0.5 mr-2"></i> <span class="leading-relaxed">${n}</span></li>`).join('')}</ul></div>` : ''}
                                        ${kpi.alert ? `<div class="bg-rose-50 text-rose-600 p-3 rounded-xl text-xs mt-3 border border-rose-100 flex items-start"><i class="fa-solid fa-circle-exclamation mt-0.5 mr-2"></i> <span>${kpi.alert}</span></div>` : ''}
                                    </div>
                                </div>
                            </div>
                        `).join('')}
                    </div>

                    <!-- Thang điểm trừ KPI chung -->
                    <div class="mb-8">
                        <div class="flex items-center mb-2">
                            <div class="w-1 h-4 bg-indigo-500 rounded-full mr-2"></div>
                            <h4 class="font-bold text-sm text-slate-700">Thang Điểm Trừ (Áp dụng ĐỘC LẬP cho từng mục)</h4>
                        </div>
                        <p class="text-xs text-slate-500 mb-3 leading-relaxed">Lỗi của mục nào tính riêng mục đó, không cộng dồn. <br><em class="text-indigo-600 bg-indigo-50 px-1.5 py-0.5 rounded inline-block mt-1">VD: Tháng này vi phạm 4 lỗi Kỷ luật (nhận 70% thưởng), chỉ vi phạm 2 lỗi Phục vụ (nhận 90% thưởng).</em></p>
                        <div class="overflow-hidden rounded-2xl border border-slate-100 shadow-sm">
                            <table class="w-full text-xs text-center bg-white">
                                <thead class="bg-slate-50 text-slate-600 font-semibold uppercase tracking-wider text-[10px]"><tr><th class="py-3 px-1 border-b border-r border-slate-100">Số lỗi phát hiện</th><th class="py-3 px-1 border-b border-slate-100">Mức nhận KPI</th></tr></thead>
                                <tbody class="text-slate-600">
                                    ${JOB_DATA.kpiScale.map(scale => `
                                        <tr class="transition-colors hover:bg-slate-50/50">
                                            <td class="py-2.5 border-r border-b border-slate-50 ${scale.isDanger ? 'text-rose-500 font-semibold' : ''}">${scale.error}</td>
                                            <td class="py-2.5 border-b border-slate-50 font-bold ${scale.isPositive ? 'text-emerald-500' : (scale.isWarning ? 'text-orange-500' : (scale.isDanger ? 'text-rose-500' : 'text-slate-700'))}">${scale.percent}</td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>

                    <!-- Thử Thách Upsell -->
                    ${JOB_DATA.challenge.hasChallenge ? `
                    <div class="bg-gradient-to-br from-amber-50 to-orange-50 rounded-2xl p-5 border border-amber-100/50 shadow-sm mb-6 relative overflow-hidden">
                        <div class="absolute -right-4 -top-4 opacity-[0.07] text-7xl text-orange-500"><i class="fa-solid ${JOB_DATA.challenge.icon}"></i></div>
                        <h3 class="font-bold text-lg mb-1 flex items-center text-slate-800 relative z-10"><i class="fa-solid ${JOB_DATA.challenge.icon} text-amber-500 mr-2 drop-shadow-sm"></i> ${JOB_DATA.challenge.title}</h3>
                        <p class="text-xs text-slate-600 mb-5 relative z-10">Nhận tối đa <strong class="text-emerald-600 text-sm mx-0.5">${JOB_DATA.challenge.reward}</strong> ${JOB_DATA.challenge.desc}</p>
                        <div class="relative pt-1 pb-2 z-10">
                            <div class="flex justify-between text-[10px] font-bold text-slate-400 mb-1.5 px-1">
                                ${JOB_DATA.challenge.milestones.map(m => `<span class="${m.isRed ? 'text-rose-500' : (m.isGreen ? 'text-emerald-600' : '')}">${m.label}</span>`).join('')}
                            </div>
                            <div class="overflow-hidden h-3.5 mb-2.5 text-xs flex rounded-full bg-white border border-slate-100 shadow-inner">
                                <div style="width: 100%" class="shadow-none flex flex-col text-center whitespace-nowrap text-white justify-center bg-gradient-to-r from-rose-400 via-amber-400 to-emerald-400"></div>
                            </div>
                            <div class="flex justify-between text-[10px] font-bold text-slate-600 px-1">
                                ${JOB_DATA.challenge.rewards.map(r => `<span class="${r.isRed ? 'text-rose-500' : (r.isGreen ? 'text-emerald-600 font-black' : '')}">${r.label}</span>`).join('')}
                            </div>
                        </div>
                    </div>
                    ` : ''}
                </div>

                <!-- V. Nguyên Tắc -->
                <div class="bg-white rounded-2xl shadow-sm p-5 border border-slate-100">
                    <h3 class="font-bold text-lg mb-4 text-slate-800 flex items-center"><div class="w-8 h-8 rounded-full bg-rose-50 text-rose-500 flex items-center justify-center mr-3"><i class="fa-solid fa-scale-balanced"></i></div> V. Nguyên Tắc Ghi Nhận</h3>
                    <ul class="text-sm text-slate-600 space-y-3">
                        ${JOB_DATA.rules.map((rule, idx) => `
                            <li class="flex items-start">
                                <span class="flex-shrink-0 w-5 h-5 rounded-full bg-slate-100 text-slate-500 flex items-center justify-center text-[10px] font-bold mr-2.5 mt-0.5">${idx + 1}</span>
                                <span class="leading-relaxed">${rule}</span>
                            </li>
                        `).join('')}
                    </ul>
                </div>

                <!-- VI. Thâm Niên -->
                <div class="bg-emerald-50/50 rounded-2xl shadow-sm p-5 border border-emerald-100 flex items-start">
                    <div class="text-emerald-500 text-2xl mr-4 mt-1 drop-shadow-sm"><i class="fa-solid fa-arrow-trend-up"></i></div>
                    <div>
                        <h4 class="font-bold text-slate-800 mb-1.5 text-lg">VI. Chính Sách Thâm Niên</h4>
                        <p class="text-xs text-slate-600 leading-relaxed">
                            Tăng lương cơ bản <strong class="text-emerald-600 text-sm mx-0.5">${JOB_DATA.seniority.reward}</strong> <span class="text-slate-400">(${JOB_DATA.seniority.max})</span> khi đạt:<br>
                            <div class="mt-2 space-y-1.5 pl-1 border-l-2 border-emerald-200">
                                ${JOB_DATA.seniority.conditions.map(c => `<div class="text-xs text-slate-600 pl-2 relative before:content-[''] before:absolute before:left-[-5px] before:top-1.5 before:w-2 before:h-2 before:bg-white before:border-2 before:border-emerald-300 before:rounded-full">${c}</div>`).join('')}
                            </div>
                        </p>
                    </div>
                </div>

                <!-- KHU VỰC TRỢ LÝ AI (PURPLE THEME) -->
                <div class="bg-gradient-to-br from-[#6B61F5] to-[#4F46D6] rounded-[28px] p-6 shadow-xl relative overflow-hidden mt-8">
                    <!-- Decor chìm -->
                    <div class="absolute -right-8 -bottom-8 opacity-10 text-9xl text-white transform rotate-12"><i class="fa-solid fa-robot"></i></div>
                    <div class="absolute top-0 right-0 w-32 h-32 bg-white opacity-5 rounded-full blur-2xl"></div>
                    
                    <h3 class="font-black text-xl mb-1 flex items-center text-white relative z-10 drop-shadow-md">
                        Trợ Lý AI Nội Bộ <span class="ml-2 text-lg animate-sparkle">✨</span>
                    </h3>
                    <p class="text-[11px] font-bold text-indigo-100 uppercase tracking-widest mb-5 relative z-10">Hỏi ngay để giải đáp thắc mắc lương, thưởng & xử lý tình huống!</p>

                    <div class="space-y-4 relative z-10">
                        <!-- Select Dropdown -->
                        <div class="relative">
                            <select id="ai-task-type" class="w-full text-sm font-semibold bg-white/10 backdrop-blur-md border border-white/20 text-white rounded-xl p-3.5 outline-none shadow-sm focus:border-white/50 appearance-none pr-10 cursor-pointer transition-colors hover:bg-white/20">
                                ${JOB_DATA.aiConfig.taskOptions.map(opt => `<option value="${opt.id}" class="text-slate-800 bg-white font-medium">${opt.label}</option>`).join('')}
                            </select>
                            <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-white opacity-80"><i class="fa-solid fa-chevron-down text-xs"></i></div>
                        </div>
                        
                        <!-- Textarea -->
                        <textarea id="ai-input" rows="2" class="w-full text-sm bg-black/10 border border-white/10 text-white rounded-xl p-3.5 outline-none placeholder-indigo-200/60 focus:border-white/40 shadow-inner transition-colors focus:bg-black/20" placeholder="${JOB_DATA.aiConfig.taskOptions[0].placeholder}"></textarea>
                        
                        <!-- Lỗi -->
                        <div id="ai-error" class="hidden text-[11px] text-rose-200 font-semibold bg-rose-500/20 px-3 py-1.5 rounded-lg border border-rose-500/30">Vui lòng nhập câu hỏi để AI giải đáp nhé!</div>
                        
                        <!-- Nút gửi -->
                        <button onclick="askGemini()" class="w-full bg-white hover:bg-indigo-50 text-[#5A50E5] font-extrabold py-3.5 px-4 rounded-xl text-sm transition-transform active:scale-[0.98] shadow-[0_4px_14px_rgba(0,0,0,0.15)] flex justify-center items-center">
                            <span id="ai-btn-text">Gửi câu hỏi cho AI</span>
                            <span id="ai-loading" class="loader hidden ml-2"></span>
                        </button>
                        
                        <!-- Kết quả -->
                        <div id="ai-result-container" class="hidden mt-4">
                            <div class="bg-white/10 border border-white/20 rounded-2xl p-5 relative backdrop-blur-md shadow-inner">
                                <div class="inline-block bg-[#4F46D6] text-white text-[10px] font-black uppercase tracking-widest px-2.5 py-1 rounded-md mb-3 shadow-sm border border-white/10">AI Trả Lời:</div>
                                <div id="ai-result-text" class="text-sm text-indigo-50 leading-relaxed"></div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="pt-6 pb-2 text-center text-[10px] font-semibold uppercase tracking-widest text-slate-300 border-t border-slate-100 mt-8">
                    <p>Phê duyệt bởi Ban Quản lý Nhà hàng</p>
                    <p class="mt-1 opacity-70">Cập nhật lúc: ${JOB_DATA.meta.updateDate}</p>
                </div>
            </main>
        `;

        root.innerHTML = html;
        initInteractions();
    }

    /* Kích hoạt hiệu ứng Mở/Đóng các thẻ Accordion */
    function initInteractions() {
        const accordionGroups = document.querySelectorAll('.accordion-group');
        accordionGroups.forEach(group => {
            const accordions = group.querySelectorAll('.accordion-btn');
            accordions.forEach(btn => {
                btn.addEventListener('click', function() {
                    accordions.forEach(otherBtn => {
                        if(otherBtn !== this) {
                            otherBtn.nextElementSibling.classList.remove('active');
                            otherBtn.querySelector('.fa-chevron-down').classList.remove('rotate-180');
                        }
                    });
                    const content = this.nextElementSibling;
                    const icon = this.querySelector('.fa-chevron-down');
                    content.classList.toggle('active');
                    icon.classList.toggle('rotate-180');
                });
            });
        });

        // Thay đổi placeholder theo chức năng AI
        document.getElementById('ai-task-type').addEventListener('change', function(e) {
            const inputField = document.getElementById('ai-input');
            const selectedOpt = JOB_DATA.aiConfig.taskOptions.find(opt => opt.id === e.target.value);
            if(selectedOpt) inputField.placeholder = selectedOpt.placeholder;
        });
    }

    /* ======================================================================
       LOGIC KẾT NỐI GEMINI API
       ====================================================================== */
    const apiKey = ""; 

    const wait = (ms) => new Promise(resolve => setTimeout(resolve, ms));
    async function fetchWithRetry(url, options, maxRetries = 5) {
        const delays = [1000, 2000, 4000, 8000, 16000];
        for (let i = 0; i < maxRetries; i++) {
            try {
                const response = await fetch(url, options);
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                return await response.json();
            } catch (error) {
                if (i === maxRetries - 1) throw error;
                await wait(delays[i]);
            }
        }
    }

    async function askGemini() {
        const inputField = document.getElementById('ai-input');
        const taskType = document.getElementById('ai-task-type').value;
        const btnText = document.getElementById('ai-btn-text');
        const loadingIndicator = document.getElementById('ai-loading');
        const resultContainer = document.getElementById('ai-result-container');
        const resultText = document.getElementById('ai-result-text');
        const errorMsg = document.getElementById('ai-error');

        const userQuery = inputField.value.trim();
        if (!userQuery) {
            errorMsg.classList.remove('hidden');
            inputField.classList.add('border-rose-400');
            return;
        } else {
            errorMsg.classList.add('hidden');
            inputField.classList.remove('border-rose-400');
        }

        btnText.textContent = "Đang suy nghĩ...";
        loadingIndicator.classList.remove('hidden');
        resultContainer.classList.add('hidden');

        // Phân loại logic Prompt
        let systemPrompt = "";
        if (taskType === 'policy') {
            systemPrompt = `Bạn là Trợ lý Nhân sự thân thiện. Giải đáp thắc mắc dựa trên NỘI QUY NÀY:
            ${JOB_DATA.aiConfig.policyContext}
            QUY TẮC: Chỉ trả lời nội quy trên. Ngắn gọn, dễ hiểu. Nếu hỏi về phạt tiền, hãy tính sơ bộ số tiền hoặc phần trăm bị trừ.`;
        } else if (taskType === 'upsell') {
            systemPrompt = `Nhân viên vị trí ${JOB_DATA.meta.roleName} nhập món/tình huống. Gợi ý 1-2 câu thoại khéo léo, tự nhiên để tăng doanh thu. Dưới 60 chữ.`;
        } else if (taskType === 'complaint') {
            systemPrompt = `Khách phàn nàn. Gợi ý câu xin lỗi xoa dịu và hướng xử lý nhanh. Cực kỳ ngắn gọn, thực tế, dưới 60 chữ.`;
        }

        const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
        const payload = { contents: [{ parts: [{ text: userQuery }] }], systemInstruction: { parts: [{ text: systemPrompt }] } };

        try {
            const data = await fetchWithRetry(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
            let responseText = data.candidates?.[0]?.content?.parts?.[0]?.text;
            if (responseText) {
                // Tự động tô đậm bằng chữ trắng trong khung tím
                responseText = responseText.replace(/\*\*(.*?)\*\*/g, '<strong class="text-white font-bold bg-white/20 px-1.5 py-0.5 rounded">$1</strong>').replace(/\n/g, '<br><br>');
                resultText.innerHTML = responseText;
                resultContainer.classList.remove('hidden');
            } else {
                resultText.innerHTML = "<i>AI đang bận, vui lòng thử lại sau nhé!</i>";
                resultContainer.classList.remove('hidden');
            }
        } catch (error) {
            resultText.innerHTML = "<span class='text-rose-200'>Lỗi kết nối. Hãy kiểm tra API Key hoặc thử lại sau nhé!</span>";
            resultContainer.classList.remove('hidden');
        } finally {
            btnText.textContent = "Gửi câu hỏi cho AI";
            loadingIndicator.classList.add('hidden');
        }
    }

    // Khởi chạy ứng dụng
    renderApp();
</script>

</body>
</html>
